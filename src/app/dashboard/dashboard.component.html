<mat-sidenav-container class="sidenav-container" autosize>
  <mat-sidenav [ngClass]="{ hidden: !elSidebarVisible }" #drawer class="sidenav" fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'" [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="elSidebarVisible">
    <div class="menu">
      <mat-toolbar class="menu-texto">
        Menu
        <button mat-icon-button class="menu-icono" (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
      </mat-toolbar>
    </div>

    <div class="botones">
      <button mat-menu-item (click)="showView('dashboard')">
        Dashboard Principal
        <mat-icon>home</mat-icon>
      </button>
      <!-- <button mat-menu-item (click)="toggleUsuarios()">
        Usuarios
        <mat-icon>groups</mat-icon>
      </button> -->
      <!-- <div class="usuarios" [ngClass]="{ expanded: !usuariosVisible }"> -->
      <!-- <button mat-menu-item (click)="showView('crearUsuarios')">
          Crear Usuarios
          <mat-icon>person</mat-icon>
        </button> -->
      <button mat-menu-item (click)="showView('add-taxista')">
        Usuarios
        <mat-icon>group</mat-icon>
      </button>
      <!-- </div> -->
      <!-- <button mat-menu-item (click)="toggleAdmin()">
        Administración
        <mat-icon>manage_accounts</mat-icon>
      </button> -->
      <!-- <div class="administracion" [ngClass]="{ expanded: !administracionVisible }"> -->
      <button mat-menu-item (click)="showView('add-comisiones')">
        Inventario
        <mat-icon>
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#44474e">
            <path
              d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h168q13-36 43.5-58t68.5-22q38 0 68.5 22t43.5 58h168q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm80-80h280v-80H280v80Zm0-160h400v-80H280v80Zm0-160h400v-80H280v80Zm200-190q13 0 21.5-8.5T510-820q0-13-8.5-21.5T480-850q-13 0-21.5 8.5T450-820q0 13 8.5 21.5T480-790ZM200-200v-560 560Z" />
          </svg>assignment
        </mat-icon>
      </button>




    </div>

    <!-- <button mat-menu-item (click)="showView('menu-produ')">
        Producción
        <mat-icon>inventory_2</mat-icon>
      </button> -->


    <!-- </div> -->
  </mat-sidenav>

  <mat-sidenav-content>

      <div class="menu-principal">
        <div class="logo-usuario">

              <button mat-menu-item [matMenuTriggerFor]="perfil">
                <mat-icon>person</mat-icon>
                <span>Perfil</span>
              </button>
              <button mat-menu-item>
                <mat-icon>notifications</mat-icon>
                <span>Notificaciones</span>

              <button mat-menu-item>
                <mat-icon>logout</mat-icon>
                <span>Cerrar Sesión</span>
              </button>
            </mat-menu>
            <mat-menu #perfil="matMenu">
              <button mat-menu-item>
                <mat-icon>description</mat-icon>
                <span>Datos básicos</span>

      </div>

      <div class="contenedor-principal">
        <app-agregar-comisiones *ngIf="currentView === 'add-comisiones'"></app-agregar-comisiones>
