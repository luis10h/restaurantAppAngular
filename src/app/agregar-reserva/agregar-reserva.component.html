<mat-card class="card_container">
  <div class="container">
    <mat-card class="modal quitarFondoCard" appearance="outlined">
      <mat-card-header class="titulo_form">
        <h2>Agregar Reserva</h2>
      </mat-card-header>
      <mat-card-content>
        <!-- Filtro + Botón Agregar Reserva -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px;">
          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>Buscar</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Mia" #input>
          </mat-form-field>

          <!-- Botón de agregar reserva -->
          <button mat-raised-button color="primary" (click)="openReservaModal()">
            Agregar Reserva
          </button>
        </div>

        <!-- Tabla -->
        <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
              <td mat-cell *matCellDef="let row"> {{row.id}} </td>
            </ng-container>

            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
              <td mat-cell *matCellDef="let row"> {{row.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="apellido">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Apellido </th>
              <td mat-cell *matCellDef="let row"> {{row.apellido}} </td>
            </ng-container>

            <ng-container matColumnDef="cedula">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Cédula </th>
              <td mat-cell *matCellDef="let row"> {{row.cedula}} </td>
            </ng-container>

            <ng-container matColumnDef="reserva">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de Reserva </th>
              <td mat-cell *matCellDef="let row"> {{row.reserva | date: 'short'}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Sin datos -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="5">No se encontraron datos para "{{input.value}}"</td>
            </tr>
          </table>

          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>

      </mat-card-content>
    </mat-card>
  </div>
</mat-card>
