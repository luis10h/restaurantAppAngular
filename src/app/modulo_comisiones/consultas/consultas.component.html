
<div class="container">
    <mat-card class="modal quitarFondoCard" appearance="outlined">
        <mat-card-header class="titulo_form">
            <h2>Agregar Reserva ByTax</h2>
           
              <!-- <h1>{{currentView}}</h1> -->
        </mat-card-header>
        <mat-card-content>
            <div class="split">
                <div class="input_container">
                    <!-- <label for="password_field" class="input_labe}l">Nombre Completo:</label> -->
                    <mat-form-field class="input_class">
                        <mat-label>Cédula</mat-label>
                        <input matInput #message maxlength="256" placeholder="00000000"  required>
                        <mat-icon matSuffix>badge</mat-icon>
                        <mat-hint align="start"><strong>Para verificar existencia del conductor.</strong> </mat-hint>
                        <!-- <mat-hint align="end">{{message.value.length}} / 256</mat-hint> -->
                      </mat-form-field>
                </div>
            <button class="purchase--btn btn-consultar" (click)="openDialog()">
                Consultar
                <mat-icon>group</mat-icon>
              </button>
            </div>
          
        </mat-card-content>


    </mat-card>
</div>
